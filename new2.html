<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
<link
  href="https://cdn.jsdelivr.net/npm/remixicon@4.9.0/fonts/remixicon.css"
  rel="stylesheet"
/>
    <style>
body{
    background-color: #111;
}
nav{
    display: flex;
    align-items: center;
    justify-content: space-between;
    color: white;
    padding: 10px 20px;
    font-family: monospace;
    font-weight: 100;
}
.nav1{
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 15px;
}
.nav1 h6{
    font-size: 17px;
    width: 50px;
}
.nav2{
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 35px;
}
.nav2 h4{
    font-size: 17px;

}
.nav1 img{
    height: 35px;
}
.nav2 h5{
    font-size: 20px;
    display: none;
}
@media(max-width:550px){
nav{
    padding: 15px;
}
.nav1 img{
    height: 35px;
}
.nav1 h6{
font-size: 12px;
}
.nav2 h4{
   display: none;
}
.nav2 h5{
    display: block;
}
}
    </style>
</head>
<body>
    <nav>
        <div class="nav1">
            <img src="img/logo image.jpeg" alt="">
            <h6>Sheryians coding school</h6>
        </div>
        <div class="nav2">
            <h4>Home</h4>
            <h4>Courses</h4>
            <h4>Cohort 2.0</h4>
            <h4>Request callback</h4>
            <h4>Classroom</h4>
            <h5><i class="ri-menu-line"></i></h5>
        </div>
    </nav>
</body>
</html>
